<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 DNF ?" FRC RedLine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
      position: relative;
    }
    .bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.4) grayscale(0.5);
      z-index: -2;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent, var(--bg));
      z-index: -1;
    }
    .dnf-title {
      font-family: var(--font-display);
      font-size: clamp(8rem, 20vw, 20rem);
      font-weight: 900;
      color: var(--red);
      line-height: 0.8;
      letter-spacing: -0.05em;
    }
    .dnf-subtitle {
      font-family: var(--font-mono);
      font-size: 1.2rem;
      letter-spacing: 0.2em;
      margin-top: 1rem;
      margin-bottom: 3rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body data-theme="dark">
  <img src="assets/bg image.png" alt="Garage" class="bg-img" />
  <div class="overlay"></div>

  <h1 class="dnf-title">DNF.</h1>
  <p class="dnf-subtitle">404: DID NOT FINISH</p>
  
  <a href="index.html" class="btn-primary" style="display:inline-flex; text-decoration:none;">
    <span>RETURN TO GARAGE</span>
  </a>
</body>
</html>
